<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>

  body.theme-dark { background: #0f1115; color: #e8eaf0; }
  body.theme-light { background: #ffffff; color: #2c2c2c; }

  /* ---------- 侧栏 ---------- */
  .side-logo { display: flex; align-items: center; gap: 8px; padding: 18px 16px 12px; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; }

  /* ---------- 主内容 ---------- */
  .main-area { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; }
  .container { max-width: 1280px; margin: 0 auto; padding: 20px 20px 96px; }
  .panel-h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; }
  .panel-h2 .hint { font-size: 12px; opacity: .6; font-weight: normal; }

  .subtab-bar button.active { color: #ec4141; border-color: #ec4141; background: rgba(236,65,65,0.12); opacity: 1; }

  @media (max-width: 767px) {

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; }

  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(128,128,128,0.18); vertical-align: middle; }
  th { opacity: .55; font-size: 12px; font-weight: normal; }

  tbody tr:hover td { background: rgba(128,128,128,0.06); }

  .cover-thumb { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: rgba(128,128,128,0.12); display: block; }
  .title-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  .badge.kugou { color: #7fb8ff; border-color: #2b3d5c; }
  .badge.kuwo { color: #ffd27f; border-color: #5c4a2b; }

  .badge.on { color: #34c98e; border-color: #2b5c46; }

  .plat-head:hover { background: rgba(128,128,128,0.13); }

  .plat-group.open .plat-head .chev { transform: rotate(180deg); }

  .plat-group table tr.song-row.selected td { background: rgba(236,65,65,0.12); }

  /* ---------- 添加入库分栏 ---------- */
  .add-split { display: flex; gap: 16px; align-items: flex-start; }
  .add-left { flex: 1; min-width: 0; }
  .add-right { width: 380px; flex: none; position: sticky; top: 20px; max-height: calc(100vh - 120px); overflow-y: auto; }

  /* ---------- 入库进度弹窗 ---------- */

  .job-stage.is-failed { color: #ff3b30; opacity: 1; }
  .job-stage.is-failed .job-dot { background: #ff3b30; border-color: #ff3b30; }
  .job-stage.is-failed .job-dot::after { content: "✕"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; line-height: 1; }
  @keyframes job-spin { to { transform: rotate(360deg); } }
  .job-result { margin-top: 14px; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; flex-wrap: wrap; }
  .job-ok { color: #34c759; font-weight: 600; }
  .job-dup { color: #4f9cff; font-weight: 600; }
  .job-fail { color: #ff3b30; width: 100%; text-align: center; word-break: break-all; }
  .job-net { opacity: .7; width: 100%; text-align: center; }

  /* ---------- 全局底部播放条 ---------- */
  .player-bar { position: fixed; left: 208px; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 900; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(128,128,128,0.2); transition: left .2s cubic-bezier(.4,0,.2,1); }
  body.theme-dark .player-bar { background: rgba(23,26,33,0.92); }

  .player-bar.collapsed { left: 64px; }
  @media (max-width: 767px) { .player-bar { left: 0 !important; } .pb-time { display: none !important; } .pb-artist { display: none; } .pb-meta { width: 110px; } }
  .pb-cover { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; background: rgba(128,128,128,0.15); }
  .pb-note { display: flex; align-items: center; justify-content: center; color: #ec4141; font-size: 20px; }

  .float-btn { position: fixed; right: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%; background: #ec4141; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 900; box-shadow: 0 6px 24px rgba(236,65,65,0.4); border: none; transition: transform .15s; }
  .float-btn:hover { transform: scale(1.06); }
  .float-btn.playing::before, .float-btn.playing::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #ec4141; animation: pb-ripple 2s ease-out infinite; pointer-events: none; }
  .float-btn.playing::after { animation-delay: 1s; }
  @keyframes pb-ripple { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }

  /* ---------- 概览页 ---------- */
  .stat-card { background: rgba(128,128,128,0.07); border: 1px solid rgba(128,128,128,0.15); border-radius: 12px; padding: 14px 16px; transition: .15s; height: 100%; }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:hover { border-color: #ec4141; transform: translateY(-2px); }

<body>
<div id="app"></div>
<script>
"use strict";
const { createApp, ref, reactive, computed, onMounted, onBeforeUnmount, watch, nextTick, h, provide, inject } = Vue;
const naive = window.naive;

const PLAT_LABEL = { netease: "网易云", qq: "QQ 音乐", kugou: "酷狗", kuwo: "酷我", qishui: "汽水音乐" };
const PLAT_ORDER = ["netease", "qq", "kugou", "kuwo", "qishui"];
const PLAT_COLOR = { netease: "#ff8080", qq: "#7fd6a4", kugou: "#7fb8ff", kuwo: "#ffd27f", qishui: "#e08fff", other: "#9aa3b2" };
const SOURCE_PAGE = {
  netease: id => "https://music.163.com/song?id=" + id,
  qq: id => "https://y.qq.com/n/ryqq/songDetail/" + id,
  kugou: id => "https://www.kugou.com/song/#hash=" + id,
  kuwo: id => "https://www.kuwo.cn/play_detail/" + id,
  qishui: id => "https://www.qishui.com/song/" + id,
};
const JOB_STAGE_NAMES = ["解析音源", "下载音频", "获取封面与歌词", "上传到存储", "写入曲库"];

const darkOverrides = {
  common: {
    primaryColor: "#ec4141", primaryColorHover: "#ff6b6b", primaryColorPressed: "#c93535", primaryColorSuppl: "#ec4141",
    bodyColor: "#0f1115", cardColor: "#171a21", modalColor: "#171a21", popoverColor: "#1e222b",
    inputColor: "#1e222b", tableColor: "#171a21", borderColor: "#2a2f3a",
    textColor1: "#e8eaf0", textColor2: "#c8ccd4", textColor3: "#9aa3b2", dividerColor: "#2a2f3a",
  },
};
const lightOverrides = {
  common: { primaryColor: "#ec4141", primaryColorHover: "#ff6b6b", primaryColorPressed: "#c93535", primaryColorSuppl: "#ec4141" },
};

function parseLrc(raw) {
  const out = [];
  for (const line of String(raw || "").split(/\r?\n/)) {
    const stamps = [...line.matchAll(/\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
    const text = line.replace(/\[[^\]]*\]/g, "").trim();
    if (!stamps.length) { if (text) out.push({ t: -1, text }); continue; }
    for (const m of stamps) out.push({ t: Number(m[1]) * 60 + Number(m[2]) + Number((m[3] || "0").padEnd(3, "0")) / 1000, text });
  }
  return out.sort((a, b) => (a.t === -1 ? 0 : a.t) - (b.t === -1 ? 0 : b.t));
}

/* 主题状态：模块级共享 ref */
const isDark = ref(localStorage.getItem("ma_theme") !== "light");
const applyBodyClass = (val) => {
  document.body.classList.toggle("theme-dark", val);
  document.body.classList.toggle("theme-light", !val);
};
applyBodyClass(isDark.value);
watch(isDark, applyBodyClass);
const toggleTheme = () => {
  isDark.value = !isDark.value;
  localStorage.setItem("ma_theme", isDark.value ? "dark" : "light");
};

const App = {
  template: `
    <n-config-provider :theme="isDark ? darkTheme : null" :theme-overrides="isDark ? darkOverrides : lightOverrides">

          <n-dialog-provider>
            <main-content />
          </n-dialog-provider>
        </n-message-provider>
      </n-loading-bar-provider>
    </n-config-provider>
  `,
  setup() {
    return { isDark, darkTheme: naive.darkTheme, darkOverrides, lightOverrides };
  },
};

    <div class="sd-lyr-head">
      <div class="sd-lyr-tabs">

    </div>
    <div v-show="ctx.detail.lyricTab==='scroll'" ref="lyricScrollEl" class="sd-lyr-body">
      <template v-if="!ctx.detailLyricLines.length">
        <div v-if="ctx.detail.infoLoading" class="sd-lyr-empty">正在获取歌词…</div>
        <div v-else class="sd-lyr-empty">暂无歌词</div>

    </div>

  </div>
</div>
  `,
  setup() {
    const ctx = inject("ctx");
    const lyricScrollEl = ref(null);
    watch(() => ctx.activeLyricIdx, idx => {
      nextTick(() => {
        if (idx < 0 || !lyricScrollEl.value) return;
        const container = lyricScrollEl.value;
        const lineEls = container.querySelectorAll('.lyr-line[data-timed="1"]');
        if (idx >= 0 && lineEls[idx]) {
          const el = lineEls[idx];
          const target = el.offsetTop - container.clientHeight / 2 + el.clientHeight / 2;
          container.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
        }
      });
    });
    return { ctx, lyricScrollEl };
  },
};

<n-modal v-model:show="jobModal.show" :mask-closable="false" :auto-focus="false">

  `,
  setup() {
    const message = naive.useMessage();
    const dialog = naive.useDialog();

    /* ---------- 基础状态 ---------- */
    const authed = ref(false);
    const configured = ref(false);
    const loginPwd = ref("");
    const loginLoading = ref(false);
    const tab = ref("overview");
    const collapsed = ref(window.innerWidth < 768);
    const isNarrow = ref(window.innerWidth < 980);
    const onResize = () => {
      isNarrow.value = window.innerWidth < 980;
      if (window.innerWidth < 768) collapsed.value = true;
    };
    window.addEventListener("resize", onResize);
    onBeforeUnmount(() => window.removeEventListener("resize", onResize));

    const menuOptions = [
      { label: "概览", key: "overview", icon: () => h("span", { style: "font-size:15px" }, "📊") },
      { label: "添加入库", key: "add", icon: () => h("span", { style: "font-size:15px" }, "➕") },
      { label: "曲库", key: "library", icon: () => h("span", { style: "font-size:15px" }, "🎵") },
      { label: "授权", key: "keys", icon: () => h("span", { style: "font-size:15px" }, "🔑") },
      { label: "设置", key: "settings", icon: () => h("span", { style: "font-size:15px" }, "⚙️") },
    ];

    const loginSub = computed(() => configured.value ? "中央音乐解析服务 · 请输入管理密码" : "首次使用 · 请设置初始管理密码（≥6 位）");
    const loginBtnText = computed(() => configured.value ? "登 录" : "设置并进入");

    /* ---------- 工具 ---------- */
    const wrapStreamUrl = url => url && /^https?:\/\//i.test(url) ? "/admin/api/stream?url=" + encodeURIComponent(url) : url;
    async function api(path, opts) {
      const res = await fetch("/admin/api" + path, {
        credentials: "same-origin",
        headers: opts && opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : undefined,
        ...opts,
      });
      const data = await res.json().catch(() => ({ code: res.status, message: "响应解析失败", data: null }));
      if (res.status === 401 && !path.startsWith("/login") && path !== "/status") {
        authed.value = false;
        throw new Error(data.message || "未授权");
      }
      if (data.code !== 200) throw new Error(data.message || "请求失败");
      return data.data;
    }
    const jpost = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });
    const toast = (msg, isErr) => { if (isErr) message.error(msg); else message.success(msg); };
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDur = s => { s = Number(s) || 0; if (!s) return "未知"; return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
    const fmtTime = s => { s = Number(s) || 0; if (!isFinite(s) || s < 0) s = 0; return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
    const fmtBitrate = b => (b ? (b >= 1000 ? Math.round(b / 1000) : b) + "kbps" : "");
    const fmtSize = s => (s ? (s / 1024 / 1024).toFixed(1) + "MB" : "");
    const downloadProxy = (url, name) => "/admin/api/download?u=" + encodeURIComponent(url) + "&name=" + encodeURIComponent(name);
    const copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); toast("已复制"); }
      catch { window.prompt("手动复制：", text); }
    };

    /* ---------- 登录 ---------- */
    onMounted(async () => {
      try {
        const st = await api("/status");
        if (st.authed) { authed.value = true; await showMain(); }
        else { configured.value = st.configured; }
      } catch { /* 忽略，保持登录页 */ }
    });
    const doLogin = async () => {
      const pwd = loginPwd.value;
      if (!pwd) return toast("请输入密码", true);
      loginLoading.value = true;
      try {
        await jpost("/login", { password: pwd });
        loginPwd.value = "";
        toast("欢迎回来");
        authed.value = true;
        await showMain();
      } catch (e) { toast(e.message, true); }
      finally { loginLoading.value = false; }
    };
    const doLogout = async () => {
      await jpost("/logout").catch(() => {});
      closePlayer();
      closeDetail();
      authed.value = false;
    };
    async function showMain() {
      await loadLibrary();
      loadKeys();
      loadSettings();
      statsFetchedAt = Date.now();
    }

    /* ---------- 全局播放器（应用根层级，切视图不断播） ---------- */
    const player = reactive({
      track: null, trackKey: "", url: "",
      resolving: false, error: "",
      playing: false, buffering: false,
      currentTime: 0, duration: 0,
      visible: false, minimized: false,
    });
    const audioEl = ref(null);
    let playerReqId = 0;

    const playSearchSong = async (s) => {
      player.track = { title: s.title, artist: s.artist || "", cover: s.cover || "" };
      player.trackKey = "s:" + s.source + ":" + s.songId;
      player.resolving = true; player.error = ""; player.url = "";
      player.visible = true; player.minimized = false;
      player.playing = false; player.buffering = false;
      player.currentTime = 0; player.duration = 0;
      const reqId = ++playerReqId;
      try {
        const d = await api("/resolve?source=" + s.source + "&id=" + encodeURIComponent(s.songId) + "&title=" + encodeURIComponent(s.title) + "&artist=" + encodeURIComponent(s.artist || ""));
        if (reqId !== playerReqId) return;
        player.url = wrapStreamUrl(d.url);
        player.resolving = false;
        toast("解析成功");
        await nextTick();
        const a = audioEl.value;
        if (a) { try { await a.play(); } catch { /* 用户手势限制 */ } }
      } catch (err) {
        if (reqId !== playerReqId) return;
        player.resolving = false;
        player.error = err.message;
        toast("解析失败：" + err.message, true);
      }
    };
    const playLibraryTrack = (t) => {
      if (!t.audio_url) { toast("该曲目无音频", true); return; }
      player.track = { title: t.title, artist: t.artist || "", cover: t.cover_url || "" };
      player.trackKey = "t:" + t.id;
      player.resolving = false; player.error = "";
      player.url = t.audio_url;
      player.visible = true; player.minimized = false;
      player.playing = false; player.buffering = false;
      player.currentTime = 0; player.duration = 0;
      nextTick(async () => {
        const a = audioEl.value;
        if (a) { try { await a.play(); } catch { /* 用户手势限制 */ } }
      });
    };
    const togglePlay = async () => {
      const a = audioEl.value;
      if (!a || !player.url) return;
      if (a.paused) { try { await a.play(); } catch { /* 忽略 */ } }
      else a.pause();
    };
    const closePlayer = () => {
      const a = audioEl.value;
      if (a) { a.pause(); a.removeAttribute("src"); a.load(); }
      player.track = null; player.trackKey = ""; player.url = "";
      player.visible = false; player.minimized = false;
      player.playing = false; player.buffering = false;
      player.currentTime = 0; player.duration = 0;
      player.resolving = false; player.error = "";
    };
    const onAudioPlay = () => { player.playing = true; };
    const onAudioPause = () => { player.playing = false; };
    const onAudioEnded = () => { player.playing = false; };
    const onAudioTime = () => {
      const a = audioEl.value;
      if (a) {
        player.currentTime = a.currentTime || 0;
        if (a.duration && isFinite(a.duration)) player.duration = a.duration;
      }
    };
    const onAudioMeta = () => {
      const a = audioEl.value;
      if (a && a.duration && isFinite(a.duration)) player.duration = a.duration;
      player.buffering = false;
    };
    const onAudioWaiting = () => { player.buffering = true; };
    const onAudioPlaying = () => { player.buffering = false; };
    const onAudioError = () => {
      if (player.visible && player.url && !player.resolving) {
        player.error = "播放失败，音源可能已失效";
        player.buffering = false;
        toast("播放失败，音源可能已失效", true);
      }
    };
    const seekPct = computed(() => player.duration ? Math.min(1000, Math.max(0, player.currentTime / player.duration * 1000)) : 0);
    const onSeek = (e) => {
      const a = audioEl.value;
      if (!a || !player.duration || !isFinite(player.duration)) return;
      a.currentTime = (Number(e.target.value) / 1000) * player.duration;
    };
    const rowIcon = (key) => {
      if (player.trackKey === key) {
        if (player.resolving) return "⏳";
        return player.playing ? "⏸" : "▶";
      }
      return "▶";
    };
    const searchKey = s => "s:" + s.source + ":" + s.songId;
    const libKey = t => "t:" + t.id;
    const playSearchClick = (s) => {
      if (player.trackKey === searchKey(s)) togglePlay();
      else playSearchSong(s);
    };
    const playLibClick = (t) => {
      if (player.trackKey === libKey(t)) togglePlay();
      else playLibraryTrack(t);
    };

    /* ---------- 搜索 ---------- */
    const subtab = ref("search");
    const searchKw = ref("");
    const pasteInput = ref("");
    const searchData = reactive({ netease: [], qq: [], kugou: [], kuwo: [], qishui: [] });
    const openPlats = reactive({});
    const searchLoading = ref(false);
    const searchDone = ref(false);
    const pasteLoading = ref(false);
    const searchPlats = computed(() => PLAT_ORDER.filter(p => (searchData[p] || []).length));

    const detailLyric = computed(() => (detail.songInfo && detail.songInfo.lyric) || "");

    const timedLineIndices = computed(() => {
      const arr = [];
      detailLyricLines.value.forEach((l, i) => { if (l.t >= 0) arr.push(i); });
      return arr;
    });
    const activeLyricIdx = computed(() => {
      if (player.trackKey !== detailKey.value) return -1;
      const cur = player.currentTime;
      const lines = detailLyricLines.value;
      const timed = timedLineIndices.value;
      let idx = -1;
      for (let i = 0; i < timed.length; i++) {
        if (lines[timed[i]].t <= cur) idx = i;
        else break;
      }
      return idx;
    });
    const isActiveLine = (i) => {
      const l = detailLyricLines.value[i];
      if (!l || l.t < 0) return false;
      return timedLineIndices.value[activeLyricIdx.value] === i;
    };
    const fileBase = computed(() => {
      const t = (detailTitle.value || "未知歌曲").replace(/[\\/:*?"<>|]/g, "_");
      const a = (detailArtist.value || "未知歌手").replace(/[\\/:*?"<>|]/g, "_");

      const blob = new Blob([detailLyric.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);

    const openSearchDetail = (s) => {

    let jobTimer = null;

    const renderJobStages = (activeIdx, terminal) => {
      jobModal.stages = JOB_STAGE_NAMES.map((name, i) => {
        let status = "pending";
        if (terminal === "done") status = "done";
        else if (terminal === "error") {
          if (i < activeIdx) status = "done";
          else if (i === activeIdx) status = "failed";
        } else {
          if (i < activeIdx) status = "done";
          else if (i === activeIdx) status = "active";
        }
        return { name, status };
      });

    const startJob = async (payload) => {
      if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
      jobPayload = payload;
      jobModal.netFails = 0;
      jobModal.result = "running";
      jobModal.error = "";
      jobModal.showRetry = false;
      renderJobStages(0, null);
      let d;
      try {
        d = await jpost("/ingest/async", payload);
      } catch (err) {
        renderJobStages(0, "error");
        jobModal.error = "提交任务失败：" + err.message;
        jobModal.result = "error";
        jobModal.showRetry = true;
        return;
      }
      pollJob(d.job_id);
    };
    const pollJob = (id) => {
      jobTimer = setTimeout(async () => {
        let job;
        try {
          job = await api("/ingest/progress/" + id);
          jobModal.netFails = 0;
        } catch {
          jobModal.netFails++;
          if (jobModal.netFails >= 20) {
            jobModal.error = "网络中断，已连续 " + jobModal.netFails + " 次无法获取进度（任务可能仍在后台执行，重试会自动判重）";
            jobModal.result = "error";
            jobModal.showRetry = true;
            return;
          }
          jobModal.error = "网络波动，第 " + jobModal.netFails + " 次重连中…";
          jobModal.result = "netretry";
          pollJob(id);
          return;
        }
        if (job.status === "running") {
          renderJobStages(job.stage || 0, null);
          jobModal.result = "running";
          pollJob(id);

          renderJobStages(4, "done");

          jobModal.error = job.error || "入库失败";

        title: "删除 ApiKey",
        content: "确定删除这个 Key？对应项目会立即无法调用服务",
        positiveText: "删除",
        negativeText: "取消",
        onPositiveClick: async () => {
          try { await jpost("/keys/delete", { id: k.id }); loadKeys(); }
          catch (err) { toast(err.message, true); }
        },
      });
    };

    /* ---------- 设置 ---------- */
    const r2Domain = ref("");
    const r2Loading = ref(false);
    const oldPwd = ref("");
    const newPwd = ref("");
    const pwdLoading = ref(false);
    const loadSettings = async () => {
      try { const d = await api("/settings"); r2Domain.value = d.r2_domain || ""; } catch { /* 忽略 */ }
    };
    const saveR2 = async () => {
      r2Loading.value = true;
      try { await jpost("/settings", { r2_domain: r2Domain.value.trim() }); toast("设置已保存"); }
      catch (e) { toast(e.message, true); }
      finally { r2Loading.value = false; }
    };
    const savePwd = async () => {
      const oldP = oldPwd.value, newP = newPwd.value;
      if (!oldP || !newP) return toast("请填写原密码和新密码", true);
      pwdLoading.value = true;
      try {
        await jpost("/password", { old_password: oldP, new_password: newP });
        oldPwd.value = ""; newPwd.value = "";
        toast("密码已修改");
      } catch (e) { toast(e.message, true); }
      finally { pwdLoading.value = false; }
    };

    /* ---------- 概览统计 ---------- */
    let statsFetchedAt = 0;
    const overviewLoading = ref(false);
    const stats = computed(() => {
      const list = libList.value;
      return {
        total: list.length,
        enabled: list.filter(t => t.enabled).length,
        vip: list.filter(t => t.vip).length,
        missLyric: list.filter(t => !t.has_lyric).length,
        missCover: list.filter(t => !t.has_cover).length,
        topTags: [...tagList.value].sort((a, b) => b.count - a.count).slice(0, 5),
        recent: list.slice(0, 5),
        keysEnabled: keyList.value.filter(k => k.enabled).length,
      };
    });
    const platDistAll = computed(() => {
      const list = libList.value;
      const total = list.length || 1;
      const rows = PLAT_ORDER.map(p => ({
        key: p, label: PLAT_LABEL[p], color: PLAT_COLOR[p],
        count: list.filter(t => t.source === p).length,
      }));
      rows.push({
        key: "other", label: "上传/网络", color: PLAT_COLOR.other,
        count: list.filter(t => !PLAT_ORDER.includes(t.source)).length,
      });
      rows.forEach(r => { r.pct = Math.round(r.count / total * 100); });
      return rows;
    });
    const tagPct = (count) => {
      const max = stats.value.topTags.length ? stats.value.topTags[0].count : 1;
      return Math.round(count / (max || 1) * 100);
    };
    const refreshOverview = async (force) => {
      if (!force && Date.now() - statsFetchedAt < 60000) return;
      overviewLoading.value = true;
      try {
        await Promise.all([loadLibrary(), loadKeys()]);
        statsFetchedAt = Date.now();
      } finally { overviewLoading.value = false; }
    };
    watch(tab, t => { if (t === "overview") refreshOverview(false); });
    const goMissing = () => { onlyMissing.value = true; tab.value = "library"; };
    const goLibrary = () => { tab.value = "library"; };

    /* ---------- provide ctx 给详情面板 ---------- */
    const ctx = reactive({
      detail, player, submittingJob,
      detailKey, isDetailNowPlaying,
      detailCover, detailTitle, detailVip, detailArtist, detailAlbum, detailDuration, detailId,
      detailLyric, detailLyricLines, timedLineIndices, activeLyricIdx, isActiveLine, fileBase,
      toggleDetailPlay, closeDetail, submitIngest, copyLrc, downloadLrc,
      fmtDur, fmtBitrate, fmtSize, downloadProxy, PLAT_LABEL, sourcePageUrl,
    });
    provide("ctx", ctx);

    return {
      isDark, toggleTheme,
      detail, closeDetail,
      authed, configured, loginPwd, loginLoading, loginSub, loginBtnText, doLogin, doLogout,
      tab, collapsed, isNarrow, menuOptions,
      openSearchDetail, loadLibrary, detailTitle,
      searchKw, subtab, searchLoading, searchDone, searchData, searchPlats, openPlats,
      doSearch, togglePlat, expandAllPlats, collapseAllPlats,
      pasteInput, pasteLoading, doPasteParse, isSearchSelected,
      player, audioEl, togglePlay, closePlayer, seekPct, onSeek, fmtTime,
      rowIcon, searchKey, libKey, playSearchClick, playLibClick,
      onAudioPlay, onAudioPause, onAudioEnded, onAudioTime, onAudioMeta, onAudioWaiting, onAudioPlaying, onAudioError,
      upFileEl, upCoverEl, upTitle, upArtist, upLoading, doUpload,
      urlSrc, urlTitle, urlArtist, urlLoading, doUrlIngest,
      tagList, newTagName, createTag, deleteTagChip, tagModal, tagModalUrl, tagInput,
      tagInList, tagOutList, otherTags, openTag, renameTag, copyTagUrl, assignToTag, unassignFromTag,
      libList, libTotalText, playlistUrl, checkedIds, allChecked, missingList, fillAllBtnText, fillAllLoading,
      onlyMissing, visibleLibList, toggleAllChecks, fillAll, fillRow, toggleRow, deleteRow, batchTag, rowLoading, onLibRowClick,
      lyricModal, openLyricModal, saveLyric,
      keyList, newKeyName, keysEnabled, createKey, toggleKey, deleteKey, copyText,
      r2Domain, r2Loading, oldPwd, newPwd, pwdLoading, saveR2, savePwd,
      stats, platDistAll, tagPct, refreshOverview, overviewLoading, goMissing, goLibrary,
      jobModal, closeJobModal, closeJobAndDetail, retryJob,
      PLAT_LABEL, fmtDur,
    };
  },
};

const app = createApp(App);
app.component("main-content", MainContent);
app.component("detail-panel", DetailPanel);
for (const key in naive) {
  if (/^N[A-Z]/.test(key)) app.component(key, naive[key]);
}
app.mount("#app");
</script>
</body>
</html>
